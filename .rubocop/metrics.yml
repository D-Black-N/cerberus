Metrics/AbcSize:
  Max: 20

Metrics/BlockLength:
  Max: 25
  Exclude:
    - 'spec/**/*.rb'
    - 'config/routes.rb'
    - 'db/migrate/*.rb'

Metrics/BlockNesting:
  Max: 3

Metrics/ClassLength:
  Max: 120

Metrics/CyclomaticComplexity:
  Max: 8

Metrics/MethodLength:
  Max: 15
  CountComments: false
  Exclude:
    - 'db/migrate/*.rb'

Metrics/ModuleLength:
  Max: 120

Metrics/ParameterLists:
  Max: 4
  CountKeywordArgs: false

Metrics/PerceivedComplexity:
  Max: 8
